services:
  db:
    image: postgres:16
    container_name: loteria_db_compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loteria_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loteria_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - loteria-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loteria_backend_compose
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loteria_db
      - SECRET_KEY=super-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - loteria-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loteria_frontend_compose
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
    depends_on:
      - backend
    networks:
      - loteria-network

volumes:
  postgres_data:

networks:
  loteria-network:
    driver: bridge
