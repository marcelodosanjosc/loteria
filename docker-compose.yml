version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: loteria_db_compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loteria_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loteria-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loteria_backend_compose
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loteria_db
      - SECRET_KEY=super-secret-key-change-in-production
    depends_on:
      - db
    networks:
      - loteria-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loteria_frontend_compose
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - loteria-network

volumes:
  postgres_data:

networks:
  loteria-network:
    driver: bridge
